# Turns the admin token on (docker-compose.yml alone runs the admin API open, for the POC):
#   docker compose -f docker-compose.yml -f docker-compose.token.yml up -d
# The token is the Docker secret in CONSTELLATION_ADMIN_TOKEN_FILE (default ./secrets/admin_token),
# at least 32 bytes: openssl rand -hex 16 > secrets/admin_token
services:
  server:
    environment:
      CONSTELLATION_ADMIN_TOKEN_FILE: /run/secrets/admin_token
    secrets: [database_url, admin_token]
secrets:
  admin_token:
    file: ${CONSTELLATION_ADMIN_TOKEN_FILE:-./secrets/admin_token}
