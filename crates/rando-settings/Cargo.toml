[package]
name = "rando-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# `no_std` with `alloc`, no IO, no unsafe (design doc 20 section 8.1, doc 05 section 6), so
# `sdk-core` can embed it and it builds for WebAssembly. No engine and no world compiler.

# Goes to the public repo: may depend on, and read files of, public crates only
# (tools/public-boundary/check.sh).
[package.metadata.rando]
public = true

[dependencies]
# The caps of doc 20 section 7.1 (`Limits`), without `std`.
rando-limits = { path = "../rando-limits" }
# The lexer, `Pos`, the diagnostics type, "did you mean" and canonical JSON.
rando-syntax = { path = "../rando-syntax" }
# The `version "..."` requirement on the header, in Cargo's syntax (doc 20 section 2.8).
# dtolnay's crate, MIT OR Apache-2.0; no std with default features off.
semver = { version = "1", default-features = false }
serde_json = { workspace = true }
# The settings hash (doc 20 section 6) and preset token hashes (2.6); the RustCrypto crate the
# build tool already uses.
sha2 = { version = "0.11", default-features = false }
# NFC for strings in canonical JSON (doc 20 section 6); already in the tree. MIT OR Apache-2.0.
unicode-normalization = { version = "0.1", default-features = false }

[lints]
workspace = true
