[package]
name = "data-fill"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[test]]
name = "memory"
required-features = ["memory-harness"]

[[example]]
name = "measure_room"
required-features = ["memory-harness"]

# The room bench: it reads counters only this feature keeps.
[[example]]
name = "synth_room"
required-features = ["memory-harness"]

[features]
# The memory harness (`tests/memory.rs`, `examples/measure_room.rs`): a counting global allocator.
memory-harness = ["dep:allocation-counter"]
# The fill's independent cross-check (`room::fill_room_fresh`), for tests only: this crate's
# own integration tests turn it on (below); the product never does.
cross-check = []

[dependencies]
# Counts allocations per thread for the memory harness only (feature `memory-harness`).
allocation-counter = { version = "0.8", optional = true }
bits = { path = "../bits" }
# The one source of limits (rule nesting depth, fill attempts).
config = { path = "../config", default-features = false }
seed-bundle = { path = "../seed-bundle" }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
spec-rng = { path = "../spec-rng" }

[dev-dependencies]
# Itself, with the cross-check on for the integration tests.
data-fill = { path = ".", features = ["cross-check"] }

[lints]
workspace = true
