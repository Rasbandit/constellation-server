[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "constellation-server"
path = "src/main.rs"

[[test]]
name = "restart"
required-features = ["pg-tests"]

[[test]]
name = "worlds"
required-features = ["sandbox-tests"]

[[test]]
name = "memory"
required-features = ["memory-harness"]

[[example]]
name = "measure"
required-features = ["memory-harness"]

[features]
# The Postgres restart scenarios (`tests/restart.rs`). Need CONSTELLATION_DATABASE_URL and fail
# loudly without it (docs/TESTING.md rule 5).
pg-tests = ["log/pg-tests"]
# The upload and generation API through the real sandbox (`tests/worlds.rs`). Need `bwrap` and
# `python3` and fail loudly without them (docs/TESTING.md rule 5).
sandbox-tests = []
# The memory harness (`tests/memory.rs`, `examples/measure.rs`): a counting global allocator.
memory-harness = ["dep:allocation-counter"]
# The generation bench (`src/worlds/tests/gen_bench.rs`): timings of a data-only generation,
# through the real server binary of the same profile (build it first). CI's `bench` job runs it.
gen-bench = []

[dependencies]
# Counts allocations per thread for the memory harness only (feature `memory-harness`).
allocation-counter = { version = "0.8", optional = true }
# Account passwords: argon2id, memory-hard, the OWASP-recommended hash.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
config = { path = "../config" }
# Generation for a data-only manifest world, and its upload check (compile).
data-fill = { path = "../data-fill" }
edge-compat = { path = "../edge-compat" }
futures-util.workspace = true
getrandom = { version = "0.4", default-features = false }
log = { path = "../log", features = ["postgres"] }
proto = { path = "../proto" }
room-core = { path = "../room-core" }
runtime = { path = "../runtime" }
seed-bundle = { path = "../seed-bundle" }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std", "raw_value"] }
sha2 = { version = "0.11", default-features = false }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "macros", "process", "time", "io-util", "fs"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
# Static files for the web UI: Last-Modified, ranges, and the precompressed .gz/.br lookup.
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }
httpdate = "1"
yawc.workspace = true

[dev-dependencies]
e2e = { path = "../e2e" }
# The restart scenarios inject faults and read the fence straight from the database.
sqlx.workspace = true
# test-util: the paused clock, so a test of a timer never waits for real time.
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "time", "macros", "process", "test-util"] }

[lints]
workspace = true
