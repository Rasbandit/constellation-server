[package]
name = "server"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "constellation-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
config = { path = "../config" }
edge-compat = { path = "../edge-compat" }
log = { path = "../log" }
proto = { path = "../proto" }
room-core = { path = "../room-core" }
runtime = { path = "../runtime" }
seed-bundle = { path = "../seed-bundle" }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "macros"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }
yawc.workspace = true

[dev-dependencies]
e2e = { path = "../e2e" }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "time", "macros"] }

[lints]
workspace = true
