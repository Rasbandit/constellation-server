# Interop test against archipelago_rs (MIT), a real Archipelago client library, used as a path
# dependency from the sibling Archipela-Go checkout; no source of it is in this repo. Cargo must find every path
# dependency to resolve a workspace, even an optional one, so this crate is its own workspace
# (excluded from the main one) and CI never runs it: CI has no sibling checkout. Run: `just e2e-ap`.
[package]
name = "e2e-ap"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "End-to-end interop test with archipelago_rs (dev only)"

[workspace]

[features]
default = ["ap-interop"]
# Gates the real-client scenario. On by default here: this crate exists only to run it.
ap-interop = []

[dev-dependencies]
archipelago_rs = { path = "../../../Archipela-Go/core/vendor/archipelago_rs", default-features = false }
e2e = { path = "../e2e" }
serde_json = "1"
smol = "2"
# soketto 0.8.1 inflates each permessage-deflate message by finishing a stream that has no
# final block; flate2 1.1.11 started rejecting that ("incomplete deflate stream"), so every
# compressed frame fails. 1.1.10 is what the Archipela-Go app locks. Found by this test.
flate2 = "=1.1.10"

# A copy of the main workspace's [workspace.lints] (this crate is its own workspace, so it cannot
# inherit them). The e2e crate's test `the_e2e_ap_lints_match_the_workspace` keeps the two equal.
[lints.rust]
# Doc 05 18.1: unsafe only via docs/unsafe-register.md, then a per-crate override.
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_crate_dependencies = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
single_use_lifetimes = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
redundant_imports = "deny"
variant_size_differences = "deny"
explicit_outlives_requirements = "deny"
meta_variable_misuse = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }

[lints.rustdoc]
all = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Hand-picked restriction lints (the whole group contradicts itself, so no blanket enable).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
mem_forget = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
string_slice = "deny"
undocumented_unsafe_blocks = "deny"
missing_assert_message = "deny"
allow_attributes_without_reason = "deny"
clone_on_ref_ptr = "deny"
rc_buffer = "deny"
str_to_string = "deny"
empty_enum_variants_with_brackets = "deny"
fn_to_numeric_cast_any = "deny"
get_unwrap = "deny"
lossy_float_literal = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_name_method = "deny"
tests_outside_test_module = "deny"
try_err = "deny"
unneeded_field_pattern = "deny"
verbose_file_reads = "deny"
# Pedantic/cargo lints we turn off on purpose.
module_name_repetitions = "allow"   # crate::error::ErrorCode reads fine
multiple_crate_versions = "allow"   # cargo-deny owns duplicate detection (deny.toml warns)
