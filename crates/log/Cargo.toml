[package]
name = "log"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# The Postgres store (D-98). Off for crates that only need the trait and `MemLogStore`.
postgres = ["dep:config", "dep:sqlx", "dep:tokio", "dep:serde_json", "dep:tracing"]
# Runs the contract suite and the G-DB tests against a real Postgres. Needs
# CONSTELLATION_DATABASE_URL and fails loudly without it (docs/TESTING.md rule 5).
pg-tests = ["postgres"]
# The gate G-DB throughput benchmark (`tests/throughput.rs`). Manual `nightly` workflow only, never the PR gate.
pg-bench = ["pg-tests"]

[[test]]
name = "throughput"
required-features = ["pg-bench"]

[dependencies]
# Blob keys: the SHA-256 the blob seam checks every read against.
sha2 = { version = "0.11", default-features = false }
config = { path = "../config", optional = true }
proto = { path = "../proto" }
serde_json = { workspace = true, optional = true, features = ["std"] }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt"], optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
config = { path = "../config" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }

[lints]
workspace = true
