[package]
name = "world-build"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# The one source of limits (rule nesting, error count, pool test size).
config = { path = "../config", default-features = false }
# The engine (feature `engine`, on by default): its per-seed instance type, and its compiler,
# which every built manifest goes through as a last check. Without it the tool still checks
# and builds canonical JSON (doc 18 section 5.2).
data-fill = { path = "../data-fill", optional = true }
# The lexer, `Pos`, the diagnostics type, "did you mean" and canonical JSON, shared with the
# settings language (design doc 20 section 8.1).
rando-syntax = { path = "../rando-syntax" }
# The comparison operators and their monotone rule, shared with the engine.
rule-ops = { path = "../rule-ops" }
# The seed bundle type `rando generate` reads its spoiler from (with feature `engine`).
seed-bundle = { path = "../seed-bundle", optional = true }
serde_json = { workspace = true, features = ["std"] }
# SHA-256 of generated files' content and sources (doc 18 section 2.9): the RustCrypto crate the
# workspace already uses (MIT OR Apache-2.0).
sha2 = { version = "0.11", default-features = false }
# `rando.toml` (design doc 19 section 2): the parser, no writer; `serde` only for its `Table` type
# (serde is already in the tree). MIT OR Apache-2.0.
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
# `rando pack` writes a zip (design doc 19 section 4): no default features, deflate through the
# flate2 and zlib-rs already in the tree, named here so the build without the engine has a
# deflate backend and every build compresses with the same one. MIT.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
default = ["engine"]
engine = ["dep:data-fill", "dep:seed-bundle"]

[dev-dependencies]
data-fill = { path = "../data-fill" }
# The pack test checks the stored bytes are deflate at level 9 (flate2 is already in the tree).
flate2 = "1"

[[bin]]
name = "rando"
path = "src/main.rs"

# The end-to-end tests fill seeds with the engine.
[[test]]
name = "build"
required-features = ["engine"]

[lints]
workspace = true
