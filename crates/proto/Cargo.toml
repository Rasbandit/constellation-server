[package]
name = "proto"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
serde.workspace = true
# `Value` for frame payloads; `alloc` only, so the crate stays `no_std`.
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
# `std` for the tests (pretty printing, reading the committed schema).
serde_json.workspace = true
# The CWP schema is generated in tests and committed (`schema/cwp-v1.json`); pinned so the
# generated file only changes when we change the types.
schemars = "=1.2.3"
# Checks that the schema's patterns accept exactly what the Rust validators accept.
regex = "1"

[lints]
workspace = true
