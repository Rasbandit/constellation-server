[package]
name = "proto"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# Goes to the public repo: may depend on, and read files of, public crates only
# (tools/public-boundary/check.sh).
[package.metadata.rando]
public = true

[dependencies]
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The CWP schema is generated in tests and committed (`schema/cwp-v1.json`); pinned so the
# generated file only changes when we change the types.
schemars = "=1.2.3"
# Checks that the schema's patterns accept exactly what the Rust validators accept.
regex = "1"

[lints]
workspace = true
