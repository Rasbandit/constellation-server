msrv = "1.85"
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true
avoid-breaking-exported-api = true
# Doc 05 6.2 rule 5: only the config crate reads the environment.
disallowed-methods = [
  { path = "std::env::var", reason = "only the config crate reads env vars" },
  { path = "std::env::var_os", reason = "only the config crate reads env vars" },
  { path = "std::env::vars", reason = "only the config crate reads env vars" },
]
