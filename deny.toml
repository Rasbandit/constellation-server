# Doc 05 section 18.2: license allow-list, advisories, banned crates.
[licenses]
unused-allowed-license = "allow"
# Zlib: foldhash, a hasher under sqlx (D-98); permissive like MIT, notice kept with the source.
allow = ["Apache-2.0", "MIT", "Unicode-3.0", "BSD-3-Clause", "ISC", "Zlib"]
# D-97: the owner accepted yawc's MPL-2.0 (2026-11-16, no lawyer review); for yawc only.
exceptions = [{ name = "yawc", allow = ["MPL-2.0"] }]

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
deny = [{ name = "openssl" }, { name = "openssl-sys" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# D-97: yawc is pinned to a master commit (fixes not in a release yet).
allow-git = ["https://github.com/infinitefield/yawc"]
