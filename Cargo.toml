[workspace]
resolver = "2"
# Needs the sibling Archipela-Go checkout; its own workspace (see its Cargo.toml).
exclude = ["crates/e2e-ap"]
members = ["crates/bits", "crates/proto", "crates/config", "crates/spec-rng", "crates/room-core", "crates/log", "crates/sim", "crates/seed-bundle", "crates/runtime", "crates/edge-compat", "crates/server", "crates/e2e", "crates/rule-ops", "crates/data-fill", "crates/rando-syntax", "crates/rando-settings", "crates/world-build"]

[workspace.package]
version = "0.1.0" # the one version of server, web and image; bumped once per release (docs/container.md)
edition = "2024"
license = "LicenseRef-PolyForm-Strict-1.0.0"
rust-version = "1.94" # sqlx 0.9.0 needs 1.94 (D-98). shortcut: placeholder MSRV, owner sets the window (doc 05 section 19)
publish = false # published crates flip this per crate (doc 05 6.1)
description = "Constellation server workspace"
repository = "https://github.com/Rasbandit/constellation-server"
readme = "README.md"
keywords = ["constellation"]
categories = ["network-programming"]

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
# The one serde_json spec: `alloc` so no_std crates can share it (others add `std`), and
# `float_roundtrip` so a float stored in the log reads back bit for bit (its default parser can
# be 1 ULP off, which would make a replayed room disagree with the live one).
serde_json = { version = "1", default-features = false, features = ["alloc", "float_roundtrip"] }
tokio = { version = "1", default-features = false }
tracing = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# D-97: yawc pinned to a master commit past 0.5.0 (multi-offer and split-header fixes); no TLS.
# D-98: sqlx 0.9.0 with workarounds for issue 2805 (see crates/log/src/pg.rs), no ORM.
# `macros` only for `migrate!`; no `query!` macros (they need a database at compile time).
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "migrate", "macros"] }
yawc = { git = "https://github.com/infinitefield/yawc", rev = "91ed74f47622ca3b18ebba8b75b66ded56c7fdfd", default-features = false, features = ["axum"] }

[workspace.lints.rust]
# POC mode: compiler defaults plus no unsafe. Tighten again before a release.
unsafe_code = "forbid"
