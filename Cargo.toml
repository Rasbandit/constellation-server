[workspace]
resolver = "2"
members = ["crates/proto", "crates/config", "crates/spec-rng", "crates/room-core", "crates/log"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85" # shortcut: placeholder MSRV, owner sets the window (design doc 05 section 19)
publish = false # published crates flip this per crate (doc 05 6.1)
description = "Constellation server workspace"
repository = "https://example.invalid/constellation-server" # shortcut: placeholder until the repo has a home
readme = "README.md"
keywords = ["constellation"]
categories = ["network-programming"]

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = "1"

[workspace.lints.rust]
# Doc 05 18.1: unsafe only via docs/unsafe-register.md, then a per-crate override.
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_crate_dependencies = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
single_use_lifetimes = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
redundant_imports = "deny"
variant_size_differences = "deny"
explicit_outlives_requirements = "deny"
meta_variable_misuse = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Hand-picked restriction lints (the whole group contradicts itself, so no blanket enable).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
mem_forget = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
string_slice = "deny"
undocumented_unsafe_blocks = "deny"
missing_assert_message = "deny"
allow_attributes_without_reason = "deny"
clone_on_ref_ptr = "deny"
rc_buffer = "deny"
str_to_string = "deny"
empty_enum_variants_with_brackets = "deny"
fn_to_numeric_cast_any = "deny"
get_unwrap = "deny"
lossy_float_literal = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_name_method = "deny"
tests_outside_test_module = "deny"
try_err = "deny"
unneeded_field_pattern = "deny"
verbose_file_reads = "deny"
# Pedantic/cargo lints we turn off on purpose.
module_name_repetitions = "allow"   # crate::error::ErrorCode reads fine
multiple_crate_versions = "allow"   # cargo-deny owns duplicate detection (deny.toml warns)
