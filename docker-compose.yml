# Room server (rooms and the web UI, both on 38281) plus Postgres. Copy .env.example to .env first. No reverse proxy here.
services:
  server:
    image: ghcr.io/rasbandit/constellation-server:${CONSTELLATION_TAG:-latest}
    build:
      context: .
      args:
        GEN_REPO_URL: ${GEN_REPO_URL:?set GEN_REPO_URL in .env (see docs/container.md)}
        GEN_REPO_REF: ${GEN_REPO_REF:?set GEN_REPO_REF in .env (see docs/container.md)}
    # Restart only on failure. A fenced server (exit 3) is mapped to 0 by the image entrypoint, so it stays down.
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - --host
      - 0.0.0.0
      - --port
      - "38281"
      - --rooms
      - /data/rooms
      - --web-dir
      - /opt/constellation/web
      - --data-dir
      - /data
      - --admin-host
      - 0.0.0.0
      - --admin-port
      - "38282"
      - --public-host
      - ${CONSTELLATION_PUBLIC_HOST:-localhost}
    environment:
      CONSTELLATION_DATABASE_URL_FILE: /run/secrets/database_url
      CONSTELLATION_ADMIN_TOKEN_FILE: /run/secrets/admin_token
      # No per-job cgroup in a container: the limits below bound uploaded code instead (README).
      CONSTELLATION_SANDBOX_MODE: container
    secrets: [database_url, admin_token]
    mem_limit: 6g
    memswap_limit: 6g # no swap beyond mem_limit
    pids_limit: 512
    # Default seccomp profile plus only what bubblewrap needs (docs/container.md). Not privileged,
    # no added capabilities.
    security_opt:
      - seccomp=./docker/seccomp-bwrap.json
      - apparmor=unconfined
      - systempaths=unconfined
    ports:
      - "${CONSTELLATION_PORT:-38281}:38281"
      # The admin API runs uploaded code: loopback on the host only. Reach it by SSH or a proxy.
      - "127.0.0.1:${CONSTELLATION_ADMIN_PORT:-38282}:38282"
    volumes:
      - data:/data
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: constellation
      POSTGRES_DB: constellation
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U constellation -d constellation"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  data:
  pgdata:
secrets:
  admin_token:
    file: ${CONSTELLATION_ADMIN_TOKEN_FILE:-./secrets/admin_token}
  database_url:
    file: ${CONSTELLATION_DATABASE_URL_FILE:-./secrets/database_url}
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password}
