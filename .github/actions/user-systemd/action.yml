name: user systemd
description: >-
  The runner user's own systemd manager on a GitHub Ubuntu runner, for
  `systemd-run --user --scope` (a cgroup with its own memory cap).
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        # The runner is a service, not a login session: start the user's systemd manager.
        uid="$(id -u)"
        sudo loginctl enable-linger "$USER"
        sudo systemctl start "user@$uid.service"
        echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
        # Fail here, with the reason, when the manager cannot cap a scope's memory.
        XDG_RUNTIME_DIR="/run/user/$uid" systemd-run --user --scope --quiet --collect \
          -p MemoryMax=256M -- true
