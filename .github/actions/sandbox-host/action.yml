name: sandbox host
description: >-
  What the server's `sandbox-tests` need on a GitHub Ubuntu runner (docs/TESTING.md, Sandbox
  tests): bubblewrap, unprivileged user namespaces, and the runner user's own systemd manager
  for `systemd-run --user --scope` (the cgroup of each generation job).
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -q
        sudo apt-get install -y -q bubblewrap
        # Ubuntu 24.04's AppArmor stops unprivileged processes from making user namespaces;
        # bwrap needs them.
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        # The runner is a service, not a login session: start the user's systemd manager.
        uid="$(id -u)"
        sudo loginctl enable-linger "$USER"
        sudo systemctl start "user@$uid.service"
        echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
        # Fail here, with the reason, when the runner still cannot give a sandbox its cgroup.
        XDG_RUNTIME_DIR="/run/user/$uid" systemd-run --user --scope --quiet --collect \
          -p MemoryMax=256M -- bwrap --unshare-all --die-with-parent --ro-bind /usr /usr \
          --symlink usr/lib64 /lib64 --symlink usr/lib /lib --symlink usr/bin /bin \
          --proc /proc --dev /dev true
