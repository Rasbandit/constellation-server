name: nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
env:
  RUSTFLAGS: -D warnings
jobs:
  properties:
    runs-on: ubuntu-latest
    # Postgres for the log store's contract suite and the restart scenarios (D-98, gate G-DB).
    # A throwaway container; the password is not a secret.
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: constellation_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      CONSTELLATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/constellation_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked --features log/pg-tests,server/pg-tests
        env:
          PROPTEST_CASES: "50000"
  # Gate G-DB throughput (doc 11 section 4.8): fails below 60 percent of 20,000 rows per second.
  # Nightly only; runner variance keeps it out of the PR gate.
  g-db-throughput:
    runs-on: ubuntu-latest
    # Postgres for the log store's contract suite and the restart scenarios (D-98, gate G-DB).
    # A throwaway container; the password is not a secret.
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: constellation_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      CONSTELLATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/constellation_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked -p log@0.0.0 --features pg-bench --test throughput -- --nocapture
  # cargo-mutants, sharded (`--shard k/n`, round-robin so slow mutants spread out). One run over
  # the whole workspace did not fit a runner: 600-odd mutants, some of them hanging tests until
  # their timeout. Each shard runs the unmutated baseline, then its share of the mutants.
  # cargo-mutants builds each mutant with -p <its package>, so a workspace-style
  # `--features log/pg-tests` made every build fail ("package does not contain this feature"):
  # the Postgres crates run in their own job with their own `pg-tests` feature.
  mutants-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    # Postgres for the log store's contract suite and the restart scenarios (D-98, gate G-DB).
    # A throwaway container; the password is not a secret.
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: constellation_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      CONSTELLATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/constellation_test
      # Mutated bodies leave unused variables and imports; with -D warnings (and the workspace's
      # deny lints) such mutants fail to build and count as unviable (reproduced locally on
      # 2026-11-16). Lints are the other jobs' business; here they are capped (--cap-lints).
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-mutants }
      # Excluded: one equivalent mutant, `&&` to `||` in log's `fence` (reasoning in the comment
      # above that line in crates/log/src/pg.rs). Matched by name, not line number.
      - run: >-
          cargo mutants --package log --package server --features pg-tests
          --exclude-re 'pg\.rs:[0-9]+:[0-9]+: replace && with \|\| in fence$'
          --cap-lints=true --cargo-arg=--locked --in-place --no-shuffle
          --sharding round-robin --shard ${{ matrix.shard }}/3
      # The per-mutant logs, to triage a survivor without rerunning the job.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-pg-shard-${{ matrix.shard }}
          path: mutants.out
          retention-days: 14
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      # As in mutants-pg: lints capped for mutants only.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-mutants }
      # The rest of the workspace; no Postgres needed. crates/e2e is test helpers only (mutating
      # them tests nothing in the product).
      - run: cargo mutants --workspace -e 'crates/log/**' -e 'crates/server/**' -e 'crates/e2e/**' --cap-lints=true --cargo-arg=--locked --in-place --no-shuffle --sharding round-robin --shard ${{ matrix.shard }}/4
      # The per-mutant logs, to triage a survivor without rerunning the job.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out
          retention-days: 14
