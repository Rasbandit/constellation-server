name: nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
env:
  RUSTFLAGS: -D warnings
jobs:
  properties:
    runs-on: ubuntu-latest
    # Postgres for the log store's contract suite and the restart scenarios (D-98, gate G-DB).
    # A throwaway container; the password is not a secret.
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: constellation_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      CONSTELLATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/constellation_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked --features log/pg-tests,server/pg-tests
        env:
          PROPTEST_CASES: "50000"
  # Gate G-DB throughput (doc 11 section 4.8): fails below 60 percent of 20,000 rows per second.
  # Nightly only; runner variance keeps it out of the PR gate.
  g-db-throughput:
    runs-on: ubuntu-latest
    # Postgres for the log store's contract suite and the restart scenarios (D-98, gate G-DB).
    # A throwaway container; the password is not a secret.
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: constellation_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      CONSTELLATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/constellation_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked -p log@0.0.0 --features pg-bench --test throughput -- --nocapture
  mutants:
    runs-on: ubuntu-latest
    # Postgres for the log store's contract suite and the restart scenarios (D-98, gate G-DB).
    # A throwaway container; the password is not a secret.
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: constellation_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      CONSTELLATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/constellation_test
      # Mutated bodies leave unused variables and imports; with -D warnings (and the workspace's
      # deny lints) such mutants fail to build and count as unviable (reproduced locally on
      # 2026-11-16). Lints are the other jobs' business; here they are capped (--cap-lints).
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-mutants }
      # cargo-mutants builds each mutant with -p <its package>, so a workspace-style
      # `--features log/pg-tests` made every build fail ("package does not contain this
      # feature"): two runs, the Postgres crates with their own `pg-tests` feature, then the rest.
      # crates/e2e is test helpers only (mutating them tests nothing in the product).
      - run: cargo mutants --package log --package server --features pg-tests --cap-lints=true --cargo-arg=--locked --in-place --no-shuffle
      - run: cargo mutants --workspace -e 'crates/log/**' -e 'crates/server/**' -e 'crates/e2e/**' --cap-lints=true --cargo-arg=--locked --in-place --no-shuffle
        if: success() || failure()
