name: bench
# Room fill scaling on synthetic worlds (crates/data-fill/examples/synth_room.rs), release build.
# Runs only on PRs labelled `perf` and on manual dispatch, never on every PR. It prints a table to
# the job summary and uploads the JSON lines as an artifact; nothing here gates a merge yet.
# A file of its own: the `labeled` trigger in ci.yml would re-run the required `check` job and,
# through its concurrency group, cancel the run already in progress.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      players: { description: "Player counts, comma separated", default: "1,10,20,50,100" }
      checks: { description: "Checks per world", default: "1000" }
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
permissions:
  contents: read
jobs:
  bench-room:
    # On a PR: it carries `perf`, and a label event is the `perf` label itself.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'perf') &&
       (github.event.action != 'labeled' || github.event.label.name == 'perf'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with: { save-if: false }
      # Inputs go through the environment, never into the script text. Both profiles of
      # `data_fill::synth`: light, and heavy (the test world's counts per check, clocks on), each
      # on both ways of placing rounds (`data_fill::room::Path`), the forward one on 1 thread and
      # on 4, so the algorithm and the threads are timed apart and on one runner.
      - name: synth_room
        env:
          PLAYERS: ${{ inputs.players || '1,10,20,50,100' }}
          CHECKS: ${{ inputs.checks || '1000' }}
        run: |
          set -o pipefail
          # A room as the server generates it: every player on one world, prepared once and
          # loaded from its stored form, on one thread, on the path a room of that size takes.
          # First, so its peak RSS is not that of the per-player worlds below.
          for profile in light heavy; do
            cargo run --release --locked -p data-fill --features memory-harness --example synth_room -- \
              --profile "$profile" --path auto --workers 1 --worlds one \
              --players "$PLAYERS" --checks "$CHECKS" \
              | tee -a bench-room.jsonl
          done
          for profile in light heavy; do for run in "carry 1" "forward 1" "forward 4"; do
            read -r path workers <<< "$run"
            cargo run --release --locked -p data-fill --features memory-harness --example synth_room -- \
              --profile "$profile" --path "$path" --workers "$workers" \
              --players "$PLAYERS" --checks "$CHECKS" \
              | tee -a bench-room.jsonl
          done; done
          # The opt-in fill modes (`data_fill::room::Algorithm`), one thread only, next to the
          # exact fill's rows above: with and without skipping the checks of empty locations.
          for profile in light heavy; do for mode in level level,noskip level,goal shuffle shuffle,noskip shuffle,goal; do
            cargo run --release --locked -p data-fill --features memory-harness --example synth_room -- \
              --profile "$profile" --path forward --workers 1 --mode "$mode" \
              --players "$PLAYERS" --checks "$CHECKS" \
              | tee -a bench-room.jsonl
          done; done
      # How the modes' seeds are shaped, against the exact fill on the same rooms and seeds, and
      # on the two small fixture worlds against uniform beatable placements.
      - name: quality
        env:
          CHECKS: ${{ inputs.checks || '1000' }}
          MODES: exact level level,depth=100 level,depth=300 level,depth=-100 level,goal shuffle shuffle,depth=100 shuffle,depth=300 shuffle,depth=-100 shuffle,goal
        run: |
          set -o pipefail
          fair() { cargo run --release --locked -p data-fill --bin fill-fairness -- "$@" > /dev/null; }
          for profile in light heavy; do
            fair --synth "$profile" --players 1 --checks "$CHECKS" --seeds 200 --required 5 --modes "$MODES" --out "quality-$profile-1.json"
            fair --synth "$profile" --players 10 --checks "$CHECKS" --seeds 20 --modes "$MODES" --out "quality-$profile-10.json"
          done
          for world in fairness_world room_world; do
            fair --world "crates/data-fill/tests/fixtures/$world.json" --seeds 10000 --baseline 10000 --required 200 --modes "$MODES" --out "quality-$world.json"
          done
      - name: summary
        run: |
          {
            echo "### One game per room, one thread: what is done once per world and what each seed pays (measured on a GitHub-hosted ubuntu-latest runner, release build)"
            echo
            echo "Every player plays one world, as the server generates a room. Once per world version: prepare (compile to the stored ready form) and load (open the stored form). Per seed: setup (resolve the players), fill, assemble (the bundle, on the prepared tables), encode (check, hash, seed file). v1 import is what the path before did in place of encode (JSON text, parsed, encoded, the package deflated). Peak RSS is the whole process's high-water mark when the row was printed, drawing the synthetic manifest and every smaller room included."
            for profile in light heavy; do
              echo
              echo "#### Profile: $profile"
              echo
              echo "| players | path | prepare ms | load ms | setup ms | fill ms (median) | assemble ms | encode ms | v1 import ms (before) | prepared file bytes | loaded bytes | seed bytes | peak heap bytes (fill) | peak RSS bytes |"
              echo "|---|---|---|---|---|---|---|---|---|---|---|---|---|---|"
              jq -r --arg p "$profile" 'select(has("players") and .world == "one" and .profile == $p) | "| \(.players) | \(.path) | \(.prepare_ms) | \(.load_ms) | \(.setup_ms) | \(.fill_ms) | \(.seed.assemble_ms) | \(.seed.encode_ms) | \(.seed.import_v1_ms) | \(.prepared_bytes) | \(.loaded_bytes) | \(.seed.seed_bytes) | \(.peak_heap_bytes) | \(.peak_rss_bytes) |"' bench-room.jsonl
            done
            echo
            echo "### Room fill scaling (same runner; a world per player)"
            echo
            echo "Prepare and load are once per world version and summed over the room's worlds (one per player here, on one thread); setup is the per-seed rest, on the row's threads."
            echo "A room of at least \`config::ROOM_FORWARD_MIN_PLAYERS\` players takes the forward path, a smaller one the carried path."
            echo "Peak heap counts the calling thread only: on several threads it leaves out what the workers allocate."
            for profile in light heavy; do for run in "carry 1" "forward 1" "forward 4"; do
              read -r path workers <<< "$run"
              echo
              echo "#### Profile: $profile, path: $path, threads: $workers"
              echo
              echo "| players | checks | clocks | prepare ms | load ms | setup ms | fill ms (median) | rule evals | ns/eval | threads | solves | removals | retractions/removal mean | max | churn share | net lost | rounds | spheres | cross-world share | attempts | peak heap bytes (calling thread) | beatable |"
              echo "|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|"
              jq -r --arg p "$profile" --arg t "$path" --argjson w "$workers" 'select(has("players") and .world == "each" and .mode == "exact" and .profile == $p and .path == $t and .workers == $w) | "| \(.players) | \(.checks) | \(.clocks) | \(.prepare_ms) | \(.load_ms) | \(.setup_ms) | \(.fill_ms) | \(.rule_evals) | \(.ns_per_eval) | \(.workers) | \(.solves) | \(.removals) | \(.retractions_per_removal.mean) | \(.retractions_per_removal.max) | \(.churn.share) | \(.churn.net_lost) | \(.rounds) | \(.spheres) | \(.cross_world_share) | \(.attempts) | \(.peak_heap_bytes) | \(.beatable) |"' bench-room.jsonl
              echo
              jq -r --arg p "$profile" --arg t "$path" --argjson w "$workers" 'select(has("fitted_exponent") and .world == "each" and .mode == "exact" and .profile == $p and .path == $t and .workers == $w) | "Fitted exponent of fill ms over players: \(.fitted_exponent)"' bench-room.jsonl
            done; done
            echo
            echo "### Fill modes on one thread (same runner, same rooms and seed; exact is the forward path on 1 thread)"
            echo
            echo "Peak RSS is the whole process's high-water mark when the row was printed (setup and every smaller room included). Mode evals are the mode's own solves; the rest of the rule evals are the final solve that checks and reports the seed."
            for profile in light heavy; do
              echo
              echo "#### Profile: $profile"
              echo
              echo "| mode | players | fill ms (median) | fill ms (worst of 5) | rule evals | mode evals | solves | placed by the mode | repairs | swaps | fallbacks | attempts | spheres | peak heap bytes | peak RSS bytes |"
              echo "|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|"
              jq -r --arg p "$profile" 'select(has("players") and .world == "each" and .profile == $p and .path == "forward" and .workers == 1) | "| \(.mode) | \(.players) | \(.fill_ms) | \(.fill_ms_runs | max) | \(.rule_evals) | \(.mode_rule_evals) | \(.solves) | \(.placed_by_the_mode) | \(.repairs) | \(.swaps) | \(.fallbacks) | \(.attempts) | \(.spheres) | \(.peak_heap_bytes) | \(.peak_rss_bytes) |"' bench-room.jsonl
            done
            echo
            echo "### Seed shape per mode (counted over fill seeds 1 to N of one room; distances are from the exact fill on the same seeds)"
            echo
            echo "Required spheres: spheres holding an item no goal can be reached without (first seeds only, see the n in brackets). Stuck: share of a player's rounds in which no location of theirs opens. Uniform columns exist only for the small fixture worlds (rejection sampling of beatable uniform placements)."
            for q in quality-*.json; do
              echo
              echo "#### $q: $(jq -r '"\(.players) players, \(.seeds) seeds"' "$q")"
              echo
              echo "| mode | failed | placed by the mode | untouched share | swaps/seed | repairs | fallbacks | spheres mean | progression in sphere 0 | in first two | locations in first two | relative depth | required spheres (n) | location entropy | stuck mean | stuck worst 5% | sphere distance from exact | location chi2/dof vs exact | max gap vs uniform | coverage gaps vs uniform | fill ms median | worst 1% |"
              echo "|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|"
              jq -r 'def r(n): if . == null then "n/a" else (. * n | round) / n end; .modes[] | "| \(.mode) | \(.failed) | \(.placed_by_the_mode) | \(.untouched_share | r(1000)) | \(.swaps_per_seed | r(100)) | \(.repairs) | \(.fallbacks) | \(.spheres_mean | r(100)) | \(.progression_share_sphere_0 | r(1000)) | \(.progression_share_first_two_spheres | r(1000)) | \(.location_share_first_two_spheres | r(1000)) | \(.progression_relative_depth_mean | r(1000)) | \(.required_spheres_mean | r(100)) (\(.required_spheres_seeds)) | \(.progression_location_entropy_normalized | r(1000)) | \(.stuck_share_mean | r(1000)) | \(.stuck_share_worst_5_percent | r(1000)) | \(.against_exact.sphere_distribution_distance | r(1000)) | \(.against_exact.location_chi2_per_dof | r(100)) | \(.against_uniform.max_deviation.value | r(1000)) | \(.against_uniform.coverage_gaps | if . == null then "n/a" else length end) | \(.fill_ms_median | r(100)) | \(.fill_ms_worst_1_percent | r(100)) |"' "$q"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-room
          path: |
            bench-room.jsonl
            quality-*.json
