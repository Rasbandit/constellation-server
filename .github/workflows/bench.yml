name: bench
# The exact fill on synthetic worlds (crates/data-fill/examples/synth_room.rs), release build:
# light and heavy, 1, 10 and 100 players, one thread, as the engine was and as it is, on one
# runner. Runs only on PRs labelled `perf` and on manual dispatch, never on every PR. It prints
# tables to the job summary and uploads the JSON lines as an artifact. About three minutes;
# the summary says how long the compile and each row took. The opt-in fill modes, four threads,
# rooms on one world and the seed-shape report run only on a dispatch with `full` set to `on`.
# A file of its own: the `labeled` trigger in ci.yml would re-run the required `check` job and,
# through its concurrency group, cancel the run already in progress.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      players: { description: "Player counts, comma separated", default: "1,10,100" }
      checks: { description: "Checks per world", default: "1000" }
      full: { description: "on: also the fill modes, four threads, one-world rooms, seed shape", default: "off" }
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  FULL: ${{ inputs.full || 'off' }}
permissions:
  contents: read
jobs:
  bench-room:
    # On a PR: it carries `perf`, and a label event is the `perf` label itself.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'perf') &&
       (github.event.action != 'labeled' || github.event.label.name == 'perf'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with: { save-if: false }
      # Compiled apart from the rows, so the summary can say where the job's time goes.
      - name: build
        run: |
          start=$SECONDS
          cargo build --release --locked -p data-fill --features memory-harness --example synth_room
          echo $((SECONDS - start)) > build_s
      # Inputs go through the environment, never into the script text. Both profiles of
      # `data_fill::synth`: light, and heavy (the test world's counts per check, clocks on), on
      # one thread. Three engines per profile: as it is (bit rules, absent checks skipped), as it
      # was (every rule as bytecode, absent checks evaluated) and bit rules alone. The carried
      # path (`data_fill::room::Path::Carry`) only at 1 and 10 players: it is what a room under
      # `config::ROOM_FORWARD_MIN_PLAYERS` takes, and at 100 players a row of it took half a minute.
      - name: synth_room
        env:
          PLAYERS: ${{ inputs.players || '1,10,100' }}
          CHECKS: ${{ inputs.checks || '1000' }}
        run: |
          set -o pipefail
          bench() { target/release/examples/synth_room "$@" | tee -a bench-room.jsonl; }
          for profile in light heavy; do for engine in "bits skip" "bytecode check" "bits check"; do
            read -r rules absent <<< "$engine"
            bench --profile "$profile" --path carry --workers 1 --rules "$rules" --absent "$absent" \
              --players 1,10 --checks "$CHECKS"
            bench --profile "$profile" --path forward --workers 1 --rules "$rules" --absent "$absent" \
              --players "$PLAYERS" --checks "$CHECKS"
          done; done
          # One region of deep rules (`Shape::wide`, 131 checks), carried, with and without bit rules.
          for rules in bits bytecode; do
            bench --profile wide --path carry --workers 1 --rules "$rules" --players 1,10
          done
          if [ "$FULL" = on ]; then
            # A room as the server generates it: every player on one world, prepared once and
            # loaded from its stored form, on one thread, on the path a room of that size takes.
            # First, so its peak RSS is not that of the per-player worlds below.
            for profile in light heavy; do
              bench \
                --profile "$profile" --path auto --workers 1 --worlds one \
                --players "$PLAYERS" --checks "$CHECKS" \
                | tee -a bench-room.jsonl
            done
            for profile in light heavy; do for run in "forward 4"; do
              read -r path workers <<< "$run"
              bench \
                --profile "$profile" --path "$path" --workers "$workers" \
                --players "$PLAYERS" --checks "$CHECKS" \
                | tee -a bench-room.jsonl
            done; done
            # The opt-in fill modes (`data_fill::room::Algorithm`), one thread only, next to the
            # exact fill's rows above: with and without skipping the checks of empty locations.
            for profile in light heavy; do for mode in level level,noskip level,goal shuffle shuffle,noskip shuffle,goal; do
              bench \
                --profile "$profile" --path forward --workers 1 --mode "$mode" \
                --players "$PLAYERS" --checks "$CHECKS" \
                | tee -a bench-room.jsonl
            done; done
          fi
      # Skipping the checks of empty locations must not change a seed: every `noskip` row has to
      # carry the placements hash of its skipping row.
      - name: skipping changes no placement
        if: env.FULL == 'on'
        run: |
          jq -s -e '
            [.[] | select(has("players") and .rules == "bits" and .absent == "skip" and .path == "forward" and .workers == 1)] as $rows
            | [$rows[] | select(.mode | endswith(",noskip")) as $n
               | ($rows[] | select(.profile == $n.profile and .players == $n.players
                                   and .mode == ($n.mode | rtrimstr(",noskip")))) as $y
               | select($y.placements_hash != $n.placements_hash)
               | "\($n.profile) \($n.players) \($n.mode)"]
            | if length == 0 then true else error("placements differ: \(.)") end' bench-room.jsonl
      # Bit rules and skipping the absent locations' checks must not change a seed, and bit
      # rules must not change how many rules are evaluated.
      - name: the engine variants change no placement
        run: |
          jq -s -e '
            [.[] | select(.players != null)] as $rows
            | [$rows[] | select(.rules == "bytecode" or .absent == "check") as $v
               | ($rows[] | select(.rules == "bits" and .absent == $v.absent and .profile == $v.profile
                                   and .world == $v.world and .path == $v.path and .workers == $v.workers
                                   and .mode == $v.mode and .players == $v.players)) as $bits
               | ($rows[] | select(.rules == "bits" and .absent == "skip" and .profile == $v.profile
                                   and .world == $v.world and .path == $v.path and .workers == $v.workers
                                   and .mode == $v.mode and .players == $v.players)) as $now
               | select($v.placements_hash != $now.placements_hash or $v.rule_evals != $bits.rule_evals)
               | "\($v.profile) \($v.path) \($v.mode) \($v.players) \($v.rules) \($v.absent)"]
            | if length == 0 then true else error("variants differ: \(.)") end' bench-room.jsonl
          # The carried path and the forward path place the same, at every size both ran.
          jq -s -e '
            [.[] | select(.players != null and .world == "each" and .mode == "exact" and .workers == 1)] as $rows
            | [$rows[] | select(.path == "carry") as $c
               | ($rows[] | select(.path == "forward" and .profile == $c.profile and .rules == $c.rules
                                   and .absent == $c.absent and .players == $c.players)) as $f
               | select($c.placements_hash != $f.placements_hash)
               | "\($c.profile) \($c.players) \($c.rules) \($c.absent)"]
            | if length == 0 then true else error("paths differ: \(.)") end' bench-room.jsonl
      # How the modes' seeds are shaped, against the exact fill on the same rooms and seeds, and
      # on the two small fixture worlds against uniform beatable placements.
      - name: quality
        if: env.FULL == 'on'
        env:
          CHECKS: ${{ inputs.checks || '1000' }}
          MODES: exact level level,depth=100 level,depth=300 level,depth=-100 level,goal shuffle shuffle,depth=100 shuffle,depth=300 shuffle,depth=-100 shuffle,goal
        run: |
          set -o pipefail
          fair() { cargo run --release --locked -p data-fill --bin fill-fairness -- "$@" > /dev/null; }
          for profile in light heavy; do
            fair --synth "$profile" --players 1 --checks "$CHECKS" --seeds 200 --required 5 --modes "$MODES" --out "quality-$profile-1.json"
            fair --synth "$profile" --players 10 --checks "$CHECKS" --seeds 20 --modes "$MODES" --out "quality-$profile-10.json"
          done
          for world in fairness_world room_world; do
            fair --world "crates/data-fill/tests/fixtures/$world.json" --seeds 10000 --baseline 10000 --required 200 --modes "$MODES" --out "quality-$world.json"
          done
      - name: summary
        run: |
          {
            echo "### Where the job's time went (measured: wall seconds on this runner)"
            echo
            echo "Compile of the bench example, release: $(cat build_s) s. Rows: $(jq -s '[.[] | select(.players != null) | .row_s] | add | round' bench-room.jsonl) s over $(jq -s '[.[] | select(.players != null)] | length' bench-room.jsonl) rows (a row draws and prepares its worlds, fills once for the heap figure and then \`fill reps\` times for the median)."
            echo
            echo "| profile | path | rules | absent checks | players | row s | fill ms (median) | fill reps |"
            echo "|---|---|---|---|---|---|---|---|"
            jq -r 'select(.players != null) | "| \(.profile) | \(.path) \(.mode) \(.workers) | \(.rules) | \(.absent) | \(.players) | \(.row_s) | \(.fill_ms) | \(.fill_reps) |"' bench-room.jsonl
            if [ "$FULL" = on ]; then
            echo
            echo "### One game per room, one thread: what is done once per world and what each seed pays (measured on a GitHub-hosted ubuntu-latest runner, release build)"
            echo
            echo "Every player plays one world, as the server generates a room. Prepare (compile to the stored ready form) is paid once per world and server build. Load (open the stored form) is paid by every generation while each runs in its own process. Per seed: setup (resolve the players), fill, assemble (the bundle, on the prepared tables), encode (check, hash, seed file, in the child) and open (the server opens the seed file on the world's package). v1 import is what the path before did in place of encode and open together (JSON text, parsed, encoded, the package deflated, opened). Peak RSS is the whole process's high-water mark when the row was printed, drawing the synthetic manifest and every smaller room included."
            for profile in light heavy; do
              echo
              echo "#### Profile: $profile"
              echo
              echo "| players | path | prepare ms | load ms | setup ms | fill ms (median) | assemble ms | encode ms | of it: check ms | hash with the names written again ms (not paid) | open ms (server) | v1 import ms (before: encode and open) | prepared file bytes | seed bytes | peak heap bytes (fill) | peak RSS bytes after the fill | after the encode | at the end (with the comparison import) |"
              echo "|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|"
              jq -r --arg p "$profile" 'select(has("players") and .rules == "bits" and .absent == "skip" and .world == "one" and .profile == $p) | "| \(.players) | \(.path) | \(.prepare_ms) | \(.load_ms) | \(.setup_ms) | \(.fill_ms) | \(.seed.assemble_ms) | \(.seed.encode_ms) | \(.seed.validate_ms) | \(.seed.hash_whole_ms) | \(.seed.open_ms) | \(.seed.import_v1_ms) | \(.prepared_bytes) | \(.seed.seed_bytes) | \(.peak_heap_bytes) | \(.peak_rss_after_fill_bytes) | \(.seed.peak_rss_after_encode_bytes) | \(.peak_rss_bytes) |"' bench-room.jsonl
            done
            fi
            echo
            echo "### Rule evaluation before and after (same runner, same run, one thread, a world per player)"
            echo
            echo "Before: every rule as bytecode, the absent locations' checks evaluated (\`--rules bytecode --absent check\`). Bits: bit rules alone. After: bit rules, and a fill never evaluates the checks of locations that do not exist this seed. Fill ms are measured (median of 5); rule evals are counted by the solver; fill ns per eval is fill wall time over that count, so it carries the solver's bookkeeping; eval-only ns is evaluation alone, replayed on the first player's world with nothing held / with every progression item held (measured). Support checks as of a rank stay on the bytecode."
            for profile in light heavy; do
              echo
              echo "#### Profile: $profile"
              echo
              echo "| mode | path | players | fill ms before | bits | after | before / after | rule evals before (counted) | after | after: as of a rank | after: answered by bit rules | fill ns per eval before | bits | after | eval-only ns before (nothing / all held) | after | peak heap bytes before | after |"
              echo "|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|"
              jq -r -s --arg p "$profile" '
                [.[] | select(.players != null and .world == "each" and .workers == 1 and .profile == $p)] as $rows
                | $rows[] | select(.rules == "bytecode" and .absent == "check") as $b
                | ($rows[] | select(.rules == "bits" and .absent == "check" and .path == $b.path and .mode == $b.mode and .players == $b.players)) as $m
                | ($rows[] | select(.rules == "bits" and .absent == "skip" and .path == $b.path and .mode == $b.mode and .players == $b.players)) as $a
                | "| \($b.mode) | \($b.path) | \($b.players) | \($b.fill_ms) | \($m.fill_ms) | \($a.fill_ms) | \(if $a.fill_ms > 0 then ($b.fill_ms / $a.fill_ms * 100 | round) / 100 else "n/a" end) | \($b.rule_evals) | \($a.rule_evals) | \($a.rule_evals_ranked) | \($a.rule_evals_bits) | \($b.ns_per_eval) | \($m.ns_per_eval) | \($a.ns_per_eval) | \($b.eval_only.nothing_held.ns_per_eval) / \($b.eval_only.all_held.ns_per_eval) | \($a.eval_only.nothing_held.ns_per_eval) / \($a.eval_only.all_held.ns_per_eval) | \($b.peak_heap_bytes) | \($a.peak_heap_bytes) |"' bench-room.jsonl
            done
            echo
            echo "#### Rule sites per class, first player's world (counted when the world is loaded)"
            echo
            echo "Constant: no atom a solve can change (a constant, or options only). Plain: an AND/OR of has-item, event-fired and region-reached. Counted: the same with a count above one or a sum of counts. Timed: either with a time window. Bytecode: any other shape, or more than \`config::RULE_BITS_MAX_TERMS\` terms."
            echo
            echo "| profile | rule sites | constant | plain | counted | timed | bytecode | bit rule bytes per world (counted) | atom set bytes per player | absent locations' check sites (skipped) | regions | never reachable | always-open exits | regions entered only by one open exit |"
            echo "|---|---|---|---|---|---|---|---|---|---|---|---|---|---|"
            jq -r -s '[.[] | select(.players != null and .rules == "bits" and .absent == "skip")] | group_by(.profile)[] | .[0] | .rules_report as $r
              | "| \(.profile) | \($r.rule_sites) | \($r.classes.constant) | \($r.classes.plain) | \($r.classes.counted) | \($r.classes.timed) | \($r.classes.bytecode) | \($r.bit_rule_bytes_per_world) | \($r.atom_set_bytes_per_player) | \($r.absent_check_sites) | \($r.regions) | \($r.unreachable_regions) | \($r.always_open_exits) | \($r.regions_entered_only_by_one_open_exit) |"' bench-room.jsonl
            echo
            echo "#### One region of deep rules (profile wide: 131 checks and 6 events in one region, carried path)"
            echo
            echo "| rules | players | fill ms (median) | rule evals (counted) | as of a rank | answered by bit rules | fill ns per eval | eval-only ns (nothing / all held) | bytecode nodes per eval (nothing / all held) | removals | retractions per removal |"
            echo "|---|---|---|---|---|---|---|---|---|---|---|"
            jq -r 'select(.players != null and .profile == "wide") | "| \(.rules) | \(.players) | \(.fill_ms) | \(.rule_evals) | \(.rule_evals_ranked) | \(.rule_evals_bits) | \(.ns_per_eval) | \(.eval_only.nothing_held.ns_per_eval) / \(.eval_only.all_held.ns_per_eval) | \(.eval_only.nothing_held.nodes_per_eval) / \(.eval_only.all_held.nodes_per_eval) | \(.removals) | \(.retractions_per_removal.mean) |"' bench-room.jsonl
            if [ "$FULL" = on ]; then
            echo
            echo "### Room fill scaling (same runner; a world per player)"
            echo
            echo "Prepare and load are once per world version and summed over the room's worlds (one per player here, on one thread); setup is the per-seed rest, on the row's threads."
            echo "A room of at least \`config::ROOM_FORWARD_MIN_PLAYERS\` players takes the forward path, a smaller one the carried path."
            echo "Peak heap counts the calling thread only: on several threads it leaves out what the workers allocate."
            for profile in light heavy; do for run in "carry 1" "forward 1" "forward 4"; do
              read -r path workers <<< "$run"
              echo
              echo "#### Profile: $profile, path: $path, threads: $workers"
              echo
              echo "| players | checks | clocks | prepare ms | load ms | setup ms | fill ms (median) | rule evals (counted) | of them as of a rank (counted) | fill ns per eval (fill wall time / evals) | eval-only ns, nothing held (replay, measured) | eval-only ns, all held | bytecode nodes per eval, nothing held (counted) | all held | threads | solves | removals | retractions/removal mean | max | churn share | net lost | rounds | spheres | cross-world share | attempts | peak heap bytes (calling thread) | beatable |"
              echo "|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|"
              jq -r --arg p "$profile" --arg t "$path" --argjson w "$workers" 'select(has("players") and .rules == "bits" and .absent == "skip" and .world == "each" and .mode == "exact" and .profile == $p and .path == $t and .workers == $w) | "| \(.players) | \(.checks) | \(.clocks) | \(.prepare_ms) | \(.load_ms) | \(.setup_ms) | \(.fill_ms) | \(.rule_evals) | \(.rule_evals_ranked) | \(.ns_per_eval) | \(.eval_only.nothing_held.ns_per_eval) | \(.eval_only.all_held.ns_per_eval) | \(.eval_only.nothing_held.nodes_per_eval) | \(.eval_only.all_held.nodes_per_eval) | \(.workers) | \(.solves) | \(.removals) | \(.retractions_per_removal.mean) | \(.retractions_per_removal.max) | \(.churn.share) | \(.churn.net_lost) | \(.rounds) | \(.spheres) | \(.cross_world_share) | \(.attempts) | \(.peak_heap_bytes) | \(.beatable) |"' bench-room.jsonl
              echo
              jq -r --arg p "$profile" --arg t "$path" --argjson w "$workers" 'select(has("fitted_exponent") and .rules == "bits" and .absent == "skip" and .world == "each" and .mode == "exact" and .profile == $p and .path == $t and .workers == $w) | "Fitted exponent of fill ms over players: \(.fitted_exponent)"' bench-room.jsonl
            done; done
            echo
            echo "### Fill modes on one thread (same runner, same rooms and seed; exact is the forward path on 1 thread)"
            echo
            echo "Peak RSS is the whole process's high-water mark when the row was printed (setup and every smaller room included). Mode evals are the mode's own solves; the rest of the rule evals are the final solve that checks and reports the seed."
            for profile in light heavy; do
              echo
              echo "#### Profile: $profile"
              echo
              echo "| mode | players | fill ms (median) | fill ms (worst of 5) | rule evals | mode evals | solves | placed by the mode | repairs | swaps | fallbacks | attempts | spheres | peak heap bytes | peak RSS bytes | placements hash |"
              echo "|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|"
              jq -r --arg p "$profile" 'select(has("players") and .rules == "bits" and .absent == "skip" and .world == "each" and .profile == $p and .path == "forward" and .workers == 1) | "| \(.mode) | \(.players) | \(.fill_ms) | \(.fill_ms_runs | max) | \(.rule_evals) | \(.mode_rule_evals) | \(.solves) | \(.placed_by_the_mode) | \(.repairs) | \(.swaps) | \(.fallbacks) | \(.attempts) | \(.spheres) | \(.peak_heap_bytes) | \(.peak_rss_bytes) | \(.placements_hash) |"' bench-room.jsonl
            done
            echo
            echo "### Seed shape per mode (counted over fill seeds 1 to N of one room, over the seeds the mode placed itself; distances are from the exact fill on another stream of seeds, so the exact row is the noise floor)"
            echo
            echo "Required spheres: spheres holding an item no goal can be reached without (first seeds only, see the n in brackets). Stuck: share of a player's rounds in which no location of theirs opens. Uniform columns exist only for the small fixture worlds (rejection sampling of beatable uniform placements)."
            for q in quality-*.json; do
              echo
              echo "#### $q: $(jq -r '"\(.players) players, \(.seeds) seeds"' "$q")"
              echo
              echo "| mode | failed | placed by the mode | fell back (seeds) | untouched share | swaps/seed | repairs | fallback attempts | spheres mean | progression in sphere 0 | in first two | locations in first two | relative depth | required spheres (n) | location entropy | stuck mean | stuck worst 5% | sphere distance from exact | location chi2/dof vs exact | max gap vs uniform | chi2 vs uniform (dof) | coverage gaps vs uniform | fill ms median | worst 1% |"
              echo "|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|"
              jq -r 'def r(n): if . == null then "n/a" else (. * n | round) / n end; .modes[] | "| \(.mode) | \(.failed) | \(.placed_by_the_mode) | \(.fell_back_seeds) | \(.untouched_share | r(1000)) | \(.swaps_per_seed | r(100)) | \(.repairs) | \(.fallback_attempts) | \(.spheres_mean | r(100)) | \(.progression_share_sphere_0 | r(1000)) | \(.progression_share_first_two_spheres | r(1000)) | \(.location_share_first_two_spheres | r(1000)) | \(.progression_relative_depth_mean | r(1000)) | \(.required_spheres_mean | r(100)) (\(.required_spheres_seeds)) | \(.progression_location_entropy_normalized | r(1000)) | \(.stuck_share_mean | r(1000)) | \(.stuck_share_worst_5_percent | r(1000)) | \(.against_exact.sphere_distribution_distance | r(1000)) | \(.against_exact.location_chi2_per_dof | r(100)) | \(.against_uniform.max_deviation.value | r(1000)) | \(.against_uniform.chi2 | r(1)) (\(.against_uniform.dof)) | \(.against_uniform.coverage_gaps | if . == null then "n/a" else length end) | \(.fill_ms_median | r(100)) | \(.fill_ms_worst_1_percent | r(100)) |"' "$q"
            done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-room
          path: |
            bench-room.jsonl
            quality-*.json
