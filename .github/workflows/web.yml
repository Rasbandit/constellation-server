name: web
on:
  pull_request:
    paths: [web/**, .github/workflows/web.yml]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # Not frozen: bun.lock is from an older bun and a frozen install fails on it.
      - run: bun install
      - run: bun --bun run typecheck
      - run: bun --bun run test
