name: version
# One version for server, web and image: Cargo.toml's workspace version. No per-PR bump.
on:
  pull_request:
    paths: [Cargo.toml, "crates/*/Cargo.toml", web/package.json, tools/version-check/**, .github/workflows/version.yml]
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck tools/version-check/*.sh
      # The test feeds the script mismatched fixtures.
      - run: sh tools/version-check/test.sh && sh tools/version-check/check.sh
