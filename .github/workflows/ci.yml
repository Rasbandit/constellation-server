name: ci
# One job: fmt, the unit tests, the data-fill integration tests, the Python tools, the web app,
# the version check, the Postgres tests and the fill pool tests. Sandbox (bwrap) and mutation
# tests are not run in CI for now (see #185). Docs-only PRs still run `check` (it is a required check) but skip every
# step after the scope test.
# The push to main keeps the build cache warm; PRs only restore it.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE*"]
concurrency:
  group: ci-${{ github.ref }}
  # Never cancel main runs: a cancelled run skips the cache save.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CARGO_TERM_COLOR: always
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A throwaway Postgres for the `pg-tests` feature; the password is not a secret.
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: constellation_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      CONSTELLATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/constellation_test
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # code=false only for a PR that touches nothing but docs; pushes always run.
      - id: scope
        if: github.event_name == 'pull_request'
        env: { BASE: "${{ github.base_ref }}" }
        # Fails closed: a diff error or an empty file list runs every step.
        run: |
          code=true
          if files=$(git diff --name-only --no-renames "origin/$BASE...HEAD") && [ -n "$files" ] \
            && ! grep -qvE '(\.md$|^docs/|^LICENSE)' <<< "$files"; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      # No toolchain action: the runner's rustup reads rust-toolchain.toml.
      - if: steps.scope.outputs.code != 'false'
        uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - if: steps.scope.outputs.code != 'false'
        run: cargo fmt --all --check
      # Lints on the fill engine and the build tool, every target (tests included).
      - if: steps.scope.outputs.code != 'false'
        run: cargo clippy -p world-build -p data-fill --all-targets --locked -- -D warnings
      # Every library's unit tests but the fill engine's and the build tool's: the next steps
      # run those.
      - if: steps.scope.outputs.code != 'false'
        run: cargo test --workspace --exclude data-fill --exclude world-build --lib --locked
      # The world build tool's unit and integration tests (the example world filled end to end).
      - if: steps.scope.outputs.code != 'false'
        run: cargo test -p world-build --tests --locked
      # The build tool without the engine (doc 18 section 5.2): it must still build.
      - if: steps.scope.outputs.code != 'false'
        run: cargo check -p world-build --no-default-features --locked
      # Without the engine, `rando generate` refuses clearly and exits non-zero.
      - if: steps.scope.outputs.code != 'false'
        run: |
          if out=$(cargo run -q -p world-build --no-default-features --locked --bin rando -- generate 2>&1); then exit 1; fi
          echo "$out" | grep -q "built without the engine"
      # The data-only fill engine's unit, integration and binary tests (damaged sections,
      # fixtures, fairness), once.
      - if: steps.scope.outputs.code != 'false'
        run: cargo test -p data-fill --tests --locked
      # What a loaded world counts itself as holding, against a counting allocator (the cap
      # of a fill worker's kept worlds rests on it).
      - if: steps.scope.outputs.code != 'false'
        run: cargo test -p data-fill --features memory-harness --test memory --locked
      # The generation sidecar's checks (zip traversal, bombs, yaml) and the bundle converter.
      - if: steps.scope.outputs.code != 'false'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: steps.scope.outputs.code != 'false'
        run: python -m pip install pyyaml
      - if: steps.scope.outputs.code != 'false'
        run: python -m unittest discover -s tools/ap-gen && python -m unittest discover -s tools/ap-import && python -m unittest discover -s tools/port-check
      - if: steps.scope.outputs.code != 'false'
        uses: oven-sh/setup-bun@v2
      # Not frozen: bun.lock is from an older bun and a frozen install fails on it.
      - if: steps.scope.outputs.code != 'false'
        working-directory: web
        run: bun install && bun --bun run typecheck && bun --bun run test
      # One version for server, web and image: Cargo.toml's workspace version. The test feeds
      # the script mismatched fixtures.
      - if: steps.scope.outputs.code != 'false'
        run: shellcheck tools/version-check/*.sh && sh tools/version-check/test.sh && sh tools/version-check/check.sh
      # The log store contract suite and G-DB race tests on Postgres, then the server's tests with
      # Postgres (the restart scenarios). `--manifest-path`: `-p log` also names the crates.io crate.
      - if: steps.scope.outputs.code != 'false'
        run: cargo test --manifest-path crates/log/Cargo.toml --features pg-tests --lib --locked
      # `pool-tests`: the fill pool through real worker processes (the server binary this same
      # command builds), alone and under whole generations.
      - if: steps.scope.outputs.code != 'false'
        run: cargo test -p server --features pg-tests,pool-tests --locked
