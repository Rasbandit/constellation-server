name: ci
# POC mode: fmt and the unit tests only, docs-only changes skip it. No database, no end-to-end.
# The full suite with Postgres is the manual `properties` job in nightly.yml; locally `just check`.
# The push to main keeps the build cache warm; PRs only restore it.
on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE*"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE*"]
concurrency:
  group: ci-${{ github.ref }}
  # Never cancel main runs: a cancelled run skips the cache save.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CARGO_TERM_COLOR: always
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # No toolchain action: the runner's rustup reads rust-toolchain.toml.
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: cargo fmt --all --check
      - run: cargo test --workspace --lib --locked
      # The generation sidecar's checks (zip traversal, bombs, yaml) and the bundle converter.
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install pyyaml
      - run: python -m unittest discover -s tools/ap-gen && python -m unittest discover -s tools/ap-import
