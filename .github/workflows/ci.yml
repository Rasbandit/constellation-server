name: ci
# Minimal on purpose (POC): one job, docs-only changes skip it. deny, typos and docs
# run in the pre-push hook (`just check`); coverage, mutants and benchmarks are manual (nightly.yml).
# The push to main keeps the build cache warm; PRs can only restore main's cache.
on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE*"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE*"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  CARGO_TERM_COLOR: always
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    # Postgres for the log store's contract suite and the restart scenarios (D-98, gate G-DB).
    # A throwaway container; the password is not a secret.
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: constellation_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      CONSTELLATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/constellation_test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # The Postgres tests run here (`pg-tests`; they fail, never skip, without the database).
      # Not `--all-features`: that would pull the nightly-only throughput benchmark into the gate.
      - run: cargo test --workspace --locked --features log/pg-tests,server/pg-tests -- --show-output
