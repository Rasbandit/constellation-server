name: ci
on:
  pull_request:
  push:
    branches: [main]
env:
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  CARGO_TERM_COLOR: always
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    # Postgres for the log store's contract suite and the restart scenarios (D-98, gate G-DB).
    # A throwaway container; the password is not a secret.
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: constellation_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      CONSTELLATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/constellation_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # The Postgres tests run here (`pg-tests`; they fail, never skip, without the database).
      # Not `--all-features`: that would pull the nightly-only throughput benchmark into the gate.
      - run: cargo test --workspace --locked --features log/pg-tests,server/pg-tests -- --show-output
      - run: cargo doc --workspace --no-deps --all-features --locked
  coverage:
    runs-on: ubuntu-latest
    # Postgres for the log store's contract suite and the restart scenarios (D-98, gate G-DB).
    # A throwaway container; the password is not a secret.
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: constellation_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      CONSTELLATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/constellation_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: llvm-tools-preview }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-llvm-cov }
      - run: cargo llvm-cov --workspace --locked --features log/pg-tests,server/pg-tests --fail-under-lines 90
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --locked
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@master
