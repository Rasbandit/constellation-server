name: ci
# POC mode: fmt, the unit tests and the data-fill integration tests. Docs-only PRs still run
# `check` (it is a required check) but skip every step after the scope test. No database, no
# end-to-end.
# The full suite with Postgres is the manual `properties` job in nightly.yml; locally `just check`.
# The push to main keeps the build cache warm; PRs only restore it.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE*"]
concurrency:
  group: ci-${{ github.ref }}
  # Never cancel main runs: a cancelled run skips the cache save.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CARGO_TERM_COLOR: always
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # code=false only for a PR that touches nothing but docs; pushes always run.
      - id: scope
        if: github.event_name == 'pull_request'
        env: { BASE: "${{ github.base_ref }}" }
        # Fails closed: a diff error or an empty file list runs every step.
        run: |
          code=true
          if files=$(git diff --name-only --no-renames "origin/$BASE...HEAD") && [ -n "$files" ] \
            && ! grep -qvE '(\.md$|^docs/|^LICENSE)' <<< "$files"; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      # No toolchain action: the runner's rustup reads rust-toolchain.toml.
      - if: steps.scope.outputs.code != 'false'
        uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - if: steps.scope.outputs.code != 'false'
        run: cargo fmt --all --check
      - if: steps.scope.outputs.code != 'false'
        run: cargo test --workspace --lib --locked
      # The data-only fill engine's integration tests (damaged sections, fixtures, fairness).
      - if: steps.scope.outputs.code != 'false'
        run: cargo test -p data-fill --tests --locked
      # The generation sidecar's checks (zip traversal, bombs, yaml) and the bundle converter.
      - if: steps.scope.outputs.code != 'false'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: steps.scope.outputs.code != 'false'
        run: python -m pip install pyyaml
      - if: steps.scope.outputs.code != 'false'
        run: python -m unittest discover -s tools/ap-gen && python -m unittest discover -s tools/ap-import && python -m unittest discover -s tools/port-check
  # Static checks only; the image itself is built by release.yml (on PRs that touch the Dockerfile).
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008 # apt packages are not version-pinned: bookworm-slim security updates matter more
      # The secret files only need to exist for the config check.
      - run: |
          mkdir secrets && touch secrets/database_url secrets/postgres_password
          docker compose config -q
