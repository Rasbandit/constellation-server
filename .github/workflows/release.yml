name: release
# The image is built on main and on tags, never on PRs (packaging PRs get the seconds-long
# container-lint workflow). A push to main builds it, runs it under compose and, if that passes,
# publishes it to GHCR as `main` and `sha-<short sha>`. A tag vX.Y.Z (equal to the Cargo.toml
# version) publishes the version tags and `latest`. A manual run (workflow_dispatch) builds and
# runs it on any branch without pushing.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    # A newer merge replaces an older smoke run.
    concurrency:
      group: smoke-${{ github.ref }}
      cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/rasbandit/constellation-server:ci
          build-args: |
            BUILD_SHA=${{ github.sha }}
            GEN_REPO_URL=${{ secrets.GEN_REPO_URL }}
            GEN_REPO_REF=${{ vars.GEN_REPO_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Compose needs the build args set even with --no-build.
      - run: printf 'GEN_REPO_URL=%s\nGEN_REPO_REF=%s\n' "$GEN_REPO_URL" "$GEN_REPO_REF" >> .env
        env:
          GEN_REPO_URL: ${{ secrets.GEN_REPO_URL }}
          GEN_REPO_REF: ${{ vars.GEN_REPO_REF }}
      # Run the built image under compose: uid, secret read, healthcheck, Postgres 18 volume.
      - run: |
          mkdir secrets
          echo ci-password > secrets/postgres_password
          echo 'postgres://constellation:ci-password@postgres/constellation' > secrets/database_url
          openssl rand -hex 16 > secrets/admin_token
          chmod 400 secrets/database_url secrets/admin_token
          sudo chown 10001 secrets/database_url secrets/admin_token
          CONSTELLATION_TAG=ci docker compose up --no-build --wait --wait-timeout 120
      # The admin API is on the one public port: 401 without the token, 200 with it. Then a yaml
      # upload runs the sandbox (bubblewrap under the seccomp profile) and must land under
      # /data/yamls/<game>/. The token is masked so it cannot show in the log.
      - run: |
          A=http://127.0.0.1:38281
          T=$(sudo cat secrets/admin_token)
          echo "::add-mask::$T"
          test "$(curl -s -o /dev/null -w '%{http_code}' $A/api/apworlds)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $T" $A/api/apworlds)" = 200
          printf 'name: Smoke\ngame: Smoke Game\n' > smoke.yaml
          code=$(curl -s -X PUT -o up.out -w '%{http_code}' -H "Authorization: Bearer $T" --data-binary @smoke.yaml "$A/api/yamls?name=smoke.yaml")
          cat up.out; echo " (HTTP $code)"
          test "$code" = 201
          docker compose exec -T server sh -c 'ls /data/yamls/smoke-game/*.yaml'
      # The one public port serves the UI and the version: `/` is the app, a missing asset is a
      # 404, /version carries the build, and /api without the token is a 401, not the app.
      - run: |
          P=http://127.0.0.1:38281
          curl -sf $P/ | grep -qi '<div id="root">'
          curl -sf -H 'Accept: text/html' $P/abcdefgh23 | grep -qi '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' $P/assets/missing.js)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' $P/api/yamls)" = 401
          curl -sf $P/version | grep -q '"version":"'
          js=$(curl -sf $P/ | grep -o '/assets/[^"]*\.js' | head -1)
          curl -sfI -H 'Accept-Encoding: br' "$P$js" | grep -qi 'content-encoding: br'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
  # A re-run of an old main run must not overwrite `main` with an older image: publish only
  # while this commit is still the head of main (otherwise a green no-op).
  fresh:
    needs: smoke
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.head.outputs.ok }}
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          [ "$(gh api "repos/$REPO/commits/main" --jq .sha)" = "$SHA" ] && ok=true || ok=false
          [ "$ok" = true ] || echo "$SHA is not the head of main any more; not publishing"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
  push:
    needs: [smoke, fresh]
    # A tag (the smoke is skipped there) or a main push whose smoke passed and is still the head.
    if: ${{ !cancelled() && github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && needs.smoke.result == 'success' && needs.fresh.outputs.ok == 'true')) }}
    # One publish at a time per ref and never cancelled mid-push; a newer queued run replaces an
    # older queued one, and a main merge never replaces a queued tag publish.
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # The tagged commit must be on main, so a tag on a side branch cannot publish `latest`.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # The tag must be v<Cargo version> and web/package.json must agree.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: sh tools/version-check/check.sh "$TAG"
        env:
          TAG: ${{ github.ref_name }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/constellation-server
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          # No attestation: it would embed the build args (the generator URL is a secret).
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A release build carries the bare version (no BUILD_SHA); a main build adds +<short sha>.
          build-args: |
            BUILD_SHA=${{ github.ref == 'refs/heads/main' && github.sha || '' }}
            GEN_REPO_URL=${{ secrets.GEN_REPO_URL }}
            GEN_REPO_REF=${{ vars.GEN_REPO_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
