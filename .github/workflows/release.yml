name: release
# The image is built on main and on tags, never on PRs (packaging PRs get the seconds-long
# container-lint workflow). A push to main builds it and runs it under compose; a tag
# vX.Y.Z (equal to the Cargo.toml version) builds and pushes linux/amd64 to GHCR. A manual run
# (workflow_dispatch) builds and runs it on any branch without pushing.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  smoke:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/rasbandit/constellation-server:ci
          build-args: BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Run the built image under compose: uid, secret read, healthcheck, Postgres 18 volume.
      - run: |
          mkdir secrets
          echo ci-password > secrets/postgres_password
          echo 'postgres://constellation:ci-password@postgres/constellation' > secrets/database_url
          chmod 400 secrets/database_url && sudo chown 10001 secrets/database_url
          CONSTELLATION_TAG=ci docker compose up --no-build --wait --wait-timeout 120
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
  push:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The tag must be v<Cargo version> and web/package.json must agree.
      - run: sh tools/version-check/check.sh ${{ github.ref_name }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/constellation-server
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A release build carries the bare version (no BUILD_SHA).
          cache-from: type=gha
          cache-to: type=gha,mode=max
