name: release
# A tag vX.Y.Z (equal to the Cargo.toml version) builds and pushes linux/amd64 to GHCR. A PR that
# touches the packaging builds the image without pushing and runs it under compose, so a broken
# Dockerfile fails before the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: [Dockerfile, .dockerignore, docker/**, Cargo.toml, Cargo.lock, rust-toolchain.toml, .github/workflows/release.yml]
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/rasbandit/constellation-server:ci
          build-args: BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Run the built image under compose: uid, secret read, healthcheck, Postgres 19 volume.
      - run: |
          mkdir secrets
          echo ci-password > secrets/postgres_password
          echo 'postgres://constellation:ci-password@postgres/constellation' > secrets/database_url
          chmod 400 secrets/database_url && sudo chown 10001 secrets/database_url
          CONSTELLATION_TAG=ci docker compose up --no-build --wait --wait-timeout 120
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
  push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # On a tag: the tag must be v<Cargo version> and web/package.json must agree.
      - run: sh tools/version-check/check.sh ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/constellation-server
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,enable=${{ github.event_name != 'push' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A release build carries the bare version; a manual build adds +<short sha>.
          build-args: BUILD_SHA=${{ startsWith(github.ref, 'refs/tags/v') && '' || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
